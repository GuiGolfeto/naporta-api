name: naporta-api

services:
  # ------------------------------------------------------------------ banco ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naporta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naporta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-naporta}
    ports:
      # Porta no host — sobrescreva com DB_HOST_PORT no .env se a 5432 estiver ocupada.
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - naporta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-naporta} -d ${POSTGRES_DB:-naporta}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Banco de testes e2e — banco isolado do de desenvolvimento.
  # Sobe apenas com: docker compose --profile test up -d db-test
  db-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naporta}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-naporta_test_password}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-naporta_test}
    ports:
      # Porta no host — sobrescreva com DB_TEST_HOST_PORT no .env se a 5433 estiver ocupada.
      - '${DB_TEST_HOST_PORT:-5433}:5432'
    volumes:
      - naporta-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-naporta} -d ${POSTGRES_TEST_DB:-naporta_test}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------- migrations ---
  # Aplica as migrations e encerra. O banco **não** é populado com seed:
  # os dados de demonstração entram só por comando explícito
  # (`npm run seed` ou `npm run seed:api`).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    # O schema e a config do Prisma vivem no app (`apps/api`).
    command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'apps/api/prisma.config.ts']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-naporta}:${POSTGRES_PASSWORD:-naporta_dev_password}@db:5432/${POSTGRES_DB:-naporta}
    restart: 'no'

  # --------------------------------------------------------------------- api ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: api
      API_VERSION: 1
      # Dentro do container o banco é o serviço `db` (e não localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-naporta}:${POSTGRES_PASSWORD:-naporta_dev_password}@db:5432/${POSTGRES_DB:-naporta}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # O portal fala com a API a partir do browser (filtros instantâneos),
      # então a origem dele precisa estar na lista.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_TTL: ${AUTH_THROTTLE_TTL:-60000}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No container o log é estruturado (JSON), para o agregador.
      LOG_FORMAT: ${CONTAINER_LOG_FORMAT:-json}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # O container não escreve nada: os logs vão para o stdout (pino).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # -------------------------------------------------------------------- web ---
  # Portal web (Next.js). Fala com a API **no servidor** (Server Components e
  # Server Actions) e também direto do browser (filtros instantâneos) — por isso
  # a origem do portal está na lista de CORS da API.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # URL da API usada no servidor do portal.
      API_URL: http://api:3000/api/v1
      # URL da API usada no browser (embutida no bundle).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '${WEB_HOST_PORT:-3001}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  naporta-db-data:
  naporta-db-test-data:
